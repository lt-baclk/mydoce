<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>个人名片</title>

	<!-- CSS样式：负责页面布局、颜色和交互效果 -->
	<style>
		/* 重置默认样式并统一盒模型 */
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		/* 页面整体居中，并设置柔和的背景色 */
		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			font-family: "Microsoft YaHei", Arial, sans-serif;
			color: #263238;
			background: #f3f6f8;
		}

		/* 名片主体：12px圆角与柔和阴影 */
		.business-card {
			width: min(100%, 380px);
			padding: 42px 32px;
			text-align: center;
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 12px 30px rgba(38, 50, 56, 0.12);
			transition: transform 0.3s ease, box-shadow 0.3s ease;
		}

		/* 鼠标悬停时卡片轻微上浮 */
		.business-card:hover {
			transform: translateY(-6px);
			box-shadow: 0 18px 36px rgba(38, 50, 56, 0.18);
		}

		/* 圆形头像 */
		.avatar {
			width: 104px;
			height: 104px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 22px;
			border: 4px solid #e4f0f2;
			border-radius: 50%;
			color: #ffffff;
			background: #5b9ea6;
			font-size: 36px;
			font-weight: bold;
		}

		.name {
			margin-bottom: 8px;
			font-size: 28px;
			letter-spacing: 2px;
		}

		.job {
			margin-bottom: 28px;
			color: #6b7c85;
			font-size: 15px;
		}

		/* 联系方式列表 */
		.contact-list {
			display: grid;
			gap: 14px;
			padding-top: 24px;
			border-top: 1px solid #edf0f2;
			list-style: none;
		}

		.contact-list a {
			color: #52656d;
			font-size: 14px;
			text-decoration: none;
			transition: color 0.2s ease;
		}

		.contact-list a:hover {
			color: #5b9ea6;
		}
	</style>
</head>
<body>
	<!-- HTML结构：个人名片内容 -->
	<main class="business-card">
		<!-- 使用姓名首字母作为简洁头像 -->
		<div class="avatar" aria-label="头像">卢</div>

		<h1 class="name">卢锦明</h1>
		<p class="job">历史教授</p>

		<!-- 联系方式区域 -->
		<ul class="contact-list">
			<li><a href="mailto:zhangming@example.com">✉ zhangming@example.com</a></li>
			<li><a href="tel:+8613800138000">☎ +86 138 0013 8000</a></li>
			<li><a href="#">⌂ 济源市 · 中国</a></li>
		</ul>
	</main>
</body>
</html>
